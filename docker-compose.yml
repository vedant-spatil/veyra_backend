services:
  veyra-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: veyra
      POSTGRES_PASSWORD: veyra
      POSTGRES_DB: veyra
    ports:
      - "5432:5432"
    volumes:
      - veyra-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyra -d veyra"]
      interval: 3s
      timeout: 3s
      retries: 15

  veyra-redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  dograh-minio:
    image: ${REGISTRY:-ghcr.io/dograh-hq}/minio:2026.09.22
    container_name: dograh-minio
    command: server /data --console-address ":9001"
    env_file:
      - .dograh.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - dograh-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  dograh-api:
    image: ${REGISTRY:-ghcr.io/dograh-hq}/dograh-api:latest
    env_file:
      - .dograh.env
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      ENABLE_SIGNUP: "true"
      DATABASE_URL: postgresql+asyncpg://dograh_app:veyra@veyra-postgres:5432/dograh
      REDIS_URL: redis://veyra-redis:6379/1
      FASTAPI_WORKERS: "1"
      ENABLE_TELEMETRY: "false"
      MINIO_ENDPOINT: dograh-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: voice-audio
      MINIO_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      MINIO_SECURE: "false"
      FORWARDED_ALLOW_IPS: "*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      veyra-postgres:
        condition: service_healthy
      veyra-redis:
        condition: service_healthy
      dograh-minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/api/v1/health'').read()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  dograh-ui:
    image: ${REGISTRY:-ghcr.io/dograh-hq}/dograh-ui:latest
    environment:
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://dograh-api:8000
      NODE_ENV: oss
      ENABLE_TELEMETRY: "false"
    ports:
      - "127.0.0.1:3010:3010"
    depends_on:
      dograh-api:
        condition: service_healthy

  dograh-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dograh-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --url http://dograh-api:8000 --metrics 0.0.0.0:2000
    ports:
      - "127.0.0.1:2000:2000"
    depends_on:
      - dograh-api

volumes:
  veyra-pg:
  dograh-minio:
