# Public HTTPS for the new Elastic IP sslip.io name.
# Dograh keeps its own server block for /api/v1/telephony/inbound/run.
# Do not install this file on 43.204.103.141.

server {
    listen 443 ssl;
    server_name _;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
}
